<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Municipios declarados en desastre · Estado de carpetas · Santa Cruz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1c2833;--mute:#5d6b78;--line:#d8dee4;--head:#16324a;
--ok:#2e7d5b;--rev:#d99a1f;--out:#c9d0d6;}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18212a;--ink:#e6ebef;--mute:#9aa8b4;--line:#2a3743;--head:#0c1f2f;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
header{background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
header h1{font-size:1.05rem;margin:0;font-weight:650}
header p{margin:2px 0 0;font-size:.82rem;opacity:.8}
#main{display:grid;grid-template-rows:50% 50%;min-height:0}
#map{min-height:0}
#panel{background:var(--panel);overflow-y:auto;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line)}
@media(min-width:820px){#main{grid-template-rows:none;grid-template-columns:390px 1fr}#panel{order:-1;border-top:0;border-right:1px solid var(--line)}}
.decreto{border-left:4px solid var(--ok);background:var(--bg);padding:8px 10px;margin-bottom:12px;border-radius:0 6px 6px 0}
.decreto b{display:block;font-size:.95rem}
.decreto span{display:block;font-size:.82rem;color:var(--mute)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 8px}
.bar strong{font-size:.9rem}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--head);color:#fff;border-color:var(--head)}
ul{list-style:none;margin:0;padding:0}
li button{all:unset;box-sizing:border-box;display:flex;width:100%;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
li button:focus-visible,.chip:focus-visible{outline:2px solid var(--rev);outline-offset:1px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.n{flex:1}.n small{display:block;color:var(--mute);font-size:.78rem}
.nota{font-size:.78rem;color:var(--mute);margin-top:12px}
.leaflet-container{font:inherit;background:#e8edf1}
.lg{background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:.78rem;line-height:1.9}
.lg i{display:inline-block;width:12px;height:12px;border:1px solid rgba(0,0,0,.35);margin-right:6px;vertical-align:-2px}
.lbl{background:none;border:0;box-shadow:none;font-weight:600;font-size:.7rem;color:#10261a;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lbl:before{display:none}
.msg{padding:14px;color:#a33}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="t"></h1>
    <p id="st"></p>
  </header>
  <div id="main">
    <div id="map" role="img" aria-label="Mapa de municipios de Santa Cruz según estado de carpeta"></div>
    <aside id="panel">
      <div class="decreto" id="dec"></div>
      <div class="bar"><strong id="cnt"></strong><button class="chip" id="tgl" aria-pressed="false">Ver en revisión</button></div>
      <ul id="lst"></ul>
      <p class="nota" id="nota"></p>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== 1. CONFIGURACIÓN: edite solo este bloque ===== */
const CONFIG = {
  titulo: "Municipios declarados en desastre",
  subtitulo: "Gobierno Autónomo Departamental de Santa Cruz · DGR",
  corte: "dd/mm/aaaa",                       // fecha de corte de la información
  geojson: "data/municipios.geojson",        // exportado desde QGIS (EPSG:4326)
  decreto: {
    numero: "Decreto Departamental N° 548/2026",
    fecha: "28/09/2026",
    vigencia: "Vigente hasta 30/12/2026",
    objeto: "Declaratoria de Emergencia Departamental por Variaciones Climáticas y Multiples eventos Adversos"
  },
  norma: "Ley N° 602 de Gestión de Riesgos y DS N° 2342, art. 63 (documentación de respaldo)",
  total: 56
};
/* Campos esperados en la capa de QGIS:
   MUNICIPIO (texto) · COD_INE (texto) · ESTADO (1 = carpeta en orden, 2 = en revisión, 3 = sin declaratoria)
   LEY_MUN (texto, ej. "Ley Autonómica Municipal N° __/____") · FECHA_DECL (texto) · OBS (texto, opcional) */

const ESTADOS = {
  1: {t: "Carpeta en orden (cumple la norma)", c: "#2e7d5b"},
  2: {t: "Carpeta en revisión u observada",    c: "#d99a1f"},
  3: {t: "Sin declaratoria o fuera del decreto", c: "#c9d0d6"}
};

/* ===== 2. LÓGICA ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const est = f => ESTADOS[f.properties.ESTADO] ? +f.properties.ESTADO : 3;

$("t").textContent = CONFIG.titulo;
$("st").textContent = CONFIG.subtitulo + " · Corte: " + CONFIG.corte;
$("dec").innerHTML = `<b>${esc(CONFIG.decreto.numero)}</b><span>${esc(CONFIG.decreto.objeto)}</span><span>${esc(CONFIG.decreto.fecha)} · ${esc(CONFIG.decreto.vigencia)}</span>`;
$("nota").textContent = "Criterio de inclusión: " + CONFIG.norma + ". Solo se resaltan los municipios cuya carpeta fue verificada en orden.";

const map = L.map("map", {zoomControl: true, attributionControl: true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 14, attribution: "© OpenStreetMap contributors © CARTO"
}).addTo(map);

let layer, feats = [], showRev = false;

function style(f){
  const e = est(f);
  return {color: "#44525e", weight: e === 3 ? .6 : 1.4, fillColor: ESTADOS[e].c,
          fillOpacity: e === 3 ? .25 : .75};
}

function popup(p, e){
  return `<b>${esc(p.MUNICIPIO)}</b><br>${esc(ESTADOS[e].t)}` +
    (p.LEY_MUN ? `<br>${esc(p.LEY_MUN)}` : "") +
    (p.FECHA_DECL ? `<br>Declaratoria: ${esc(p.FECHA_DECL)}` : "") +
    (p.OBS ? `<br><i>${esc(p.OBS)}</i>` : "");
}

function renderList(){
  const vis = feats.filter(f => est(f) === 1 || (showRev && est(f) === 2))
                   .sort((a, b) => a.properties.MUNICIPIO.localeCompare(b.properties.MUNICIPIO, "es"));
  const ok = feats.filter(f => est(f) === 1).length;
  $("cnt").textContent = `${ok} de ${CONFIG.total} municipios con carpeta en orden`;
  $("lst").innerHTML = vis.length ? "" : "<li class='nota'>Aún no hay municipios con carpeta en orden en esta capa.</li>";
  vis.forEach(f => {
    const p = f.properties, e = est(f), li = document.createElement("li");
    li.innerHTML = `<button><span class="dot" style="background:${ESTADOS[e].c}"></span>
      <span class="n">${esc(p.MUNICIPIO)}<small>${esc(p.LEY_MUN || ESTADOS[e].t)}</small></span></button>`;
    li.firstChild.onclick = () => {
      const l = f._l; map.fitBounds(l.getBounds(), {maxZoom: 10, padding: [20, 20]}); l.openPopup();
    };
    $("lst").appendChild(li);
  });
}

$("tgl").onclick = e => {
  showRev = !showRev; e.target.setAttribute("aria-pressed", showRev); renderList();
};

fetch(CONFIG.geojson).then(r => { if (!r.ok) throw 0; return r.json(); }).then(gj => {
  feats = gj.features;
  layer = L.geoJSON(gj, {
    style,
    onEachFeature: (f, l) => {
      f._l = l;
      const e = est(f);
      l.bindPopup(popup(f.properties, e));
      if (e === 1) l.bindTooltip(esc(f.properties.MUNICIPIO), {permanent: true, direction: "center", className: "lbl"});
    }
  }).addTo(map);
  map.fitBounds(layer.getBounds());
  const n = [0, 0, 0, 0]; feats.forEach(f => n[est(f)]++);
  const lg = L.control({position: "bottomright"});
  lg.onAdd = () => {
    const d = L.DomUtil.create("div", "lg");
    d.innerHTML = Object.keys(ESTADOS).map(k => `<div><i style="background:${ESTADOS[k].c}"></i>${esc(ESTADOS[k].t)} (${n[k]})</div>`).join("");
    return d;
  };
  lg.addTo(map);
  renderList();
}).catch(() => {
  $("lst").innerHTML = "<li class='msg'>No se pudo cargar " + esc(CONFIG.geojson) + ". Verifique la ruta y publique el sitio por HTTP (no abrir el archivo directamente).</li>";
  map.setView([-17.8, -61.5], 6);
});
</script>
</body>
</html>
